services:
  - type: web
    name: commercepulse
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m commercepulse serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/dashboard
    envVars:
      - key: COMMERCEPULSE_ALLOW_MYSQL
        value: "false"
